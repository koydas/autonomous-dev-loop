# Checks executed on the PR head before the automated review (ADR-0020).
# Each check: command (run via `bash -c`), optional timeout_seconds (default 300).
# A non-zero exit forces the review verdict to REQUEST_CHANGES.
# Runs in the secret-free `evidence` job of .github/workflows/pr-review.yml.

checks:
  tests:
    command: npm test
    timeout_seconds: 300
  lint:
    command: npm run lint
    timeout_seconds: 60

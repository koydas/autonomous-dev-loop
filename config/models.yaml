# Default Groq model per pipeline.
# Override at runtime with the GROQ_MODEL environment variable.
# AI_PROVIDER (groq | anthropic) picks the primary provider, AI_PROVIDER_<STAGE> (VALIDATION, GENERATION, REVIEW,
# AUTOFIX) overrides it for one stage; the other provider is the fallback when its key is set (ADR-0032).
# Anthropic settings are the anthropic_* keys at the end of this file.
#
# openai/gpt-oss-120b replaces qwen/qwen3-32b (retired 2026-07-17) and
# llama-3.3-70b-versatile (retired 2026-08-16) (ADR-0025).
# It is a reasoning model: reasoning tokens count toward max_tokens and TPM.
# <stage>_reasoning_effort (low | medium | high) is sent to Groq only; drop it if
# GROQ_MODEL points at a non-reasoning model, which rejects the parameter, or set
# the GROQ_REASONING_EFFORT repository variable to `off` (it overrides every stage).
#
# Every stage sets <stage>_max_tokens explicitly: Groq returns 413 when one request
# (prompt + max output) exceeds the 8K free-tier TPM, and reasoning tokens count as output.
#
# Input budget (ADR-0028): estimated input × 1.10 + <stage>_max_tokens ≤ 8000.
# The estimate is chars/4 (estimateTokens), ~3% under the billed count: the 10% covers it.
# Max estimated input = floor((8000 - max_tokens) / 1.10), rounded down to the hundred:
#   max_tokens 1024 → 6341 → 6300 ; max_tokens 4096 → 3549 → 3500.
# <stage>_max_input_tokens bounds system + user prompt (autofix: user prompt only, see below).
# In callLLM, over-budget Groq requests fall back to Anthropic when its key is set.
# Review prompt fitting can fail earlier, before callLLM and any provider fallback.
# Without an available fallback, callLLM fails before an API call (avoids a Groq 413).
# Raise these values on a higher Groq tier (more TPM) or when using Anthropic.

validation:             openai/gpt-oss-120b
validation_temperature: 0
validation_reasoning_effort: low
validation_max_tokens:  1024
# (6300 × 1.10) + 1024 = 7954 ≤ 8000. System prompt ≈ 1.8K: leaves ~4.4K for the issue.
validation_max_input_tokens: 6300

generation:             openai/gpt-oss-120b
generation_temperature: 0
generation_reasoning_effort: low
generation_max_tokens:  4096
# (3500 × 1.10) + 4096 = 7946 ≤ 8000. System + user template ≈ 1.7K: leaves ~1.8K for the
# issue and the injected files. An issue citing large files fails explicitly instead of 413.
generation_max_input_tokens: 3500

# Verdicts and patches favor low sampling variability, like validation and generation.
# Temperature zero does not guarantee identical responses.
review:                 openai/gpt-oss-120b
review_temperature:     0
review_reasoning_effort: low
# A truncated review has no verdict line and fails closed to REQUEST_CHANGES.
review_max_tokens:      1024
# (6300 × 1.10) + 1024 = 7954 ≤ 8000. pr_review.mjs shrinks the diff, then the PR body, to fit;
# the old 12,000-char diff cap produced 7,283 estimated tokens: 8,521 requested → 413.
review_max_input_tokens: 6300

autofix:                openai/gpt-oss-120b
autofix_temperature:    0
autofix_reasoning_effort: low
autofix_max_tokens:     4096
# Bounds the user prompt only; the system prompt (auto-fix-system.md, ~583) comes on top.
# (583 + 2500) × 1.10 + 4096 = 7488 ≤ 8000. The former 3000 gave 8375: no margin at all.
# 2500, not 2600: leaves 466 tokens (13%) of headroom for auto-fix-system.md instead of 366 (10.3%).
# autofix_prompt_budget.test.mjs fails when less than 10% of the TPM-bounded input (3549) is left as headroom.
# Raise this value on the Groq Developer plan (higher TPM) or when using Anthropic.
autofix_max_input_tokens: 2500
# Files get the remainder (0.60). A file that does not fit is withheld with an explicit marker
# and cannot be targeted (ADR-0029); the diff already repeats most of the shown files.
autofix_diff_ratio:     0.15
autofix_feedback_ratio: 0.25

# ── Anthropic (ADR-0032) ─────────────────────────────────────────────────────
# anthropic_<stage>: model (ANTHROPIC_MODEL overrides every stage).
# anthropic_<stage>_effort: output_config.effort — low | medium | high | xhigh | max | off
#   (ANTHROPIC_EFFORT overrides every stage). `off` sends none: only for models that reject effort
#   (Sonnet 4.5, Haiku 4.5); rejected for claude-opus-5-5 and claude-sonnet-5-5, which cannot disable thinking.
#   Defaults when none is sent: claude-opus-5-5 and claude-haiku-5-5 medium, claude-sonnet-5-5 high.
# anthropic_<stage>_max_tokens: output cap, thinking included. No input budget: 1M context, no TPM cap.
#   Kept at 16000: requests are not streamed, a larger cap risks an HTTP timeout on long turns.
# No temperature: Opus 4.7+ / 5.x reject sampling parameters (400).
#
# Per-stage models (ADR-0032 amendment): PROVISIONAL until measured. A stage moves to a model only after its
# eval suite passes the ADR-0031 gates on that model (docs/evals.md#measuring-a-model). Production's primary
# is Groq (AI_PROVIDER), so today these are the fallback's models. Opus is one line away:
#   anthropic_<stage>: claude-opus-5-5
anthropic_validation:            claude-haiku-5-5
anthropic_validation_effort:     low
anthropic_validation_max_tokens: 16000
anthropic_generation:            claude-sonnet-5-5
anthropic_generation_effort:     high
anthropic_generation_max_tokens: 16000
anthropic_review:                claude-sonnet-5-5
anthropic_review_effort:         medium
anthropic_review_max_tokens:     16000
# Review diff cap on Anthropic (ADR-0038 amendment): no input budget, so the filtered diff is cut only past this many
# chars, on a line / hunk boundary with the `… [diff cut: …]` marker. 200000 chars ≈ 50k estimated tokens: 5% of the 1M
# context, ≤ $0.20 of input per review on claude-opus-5-5 ($4/MTok), ≤ $0.10 on claude-sonnet-5-5 ($2/MTok).
# Groq ignores it: its diff is bounded by review_max_input_tokens. Default 200000 when the key is absent.
anthropic_review_max_diff_chars: 200000

# ── Review eval: cut of the requires_cut cases, per provider (ADR-0038 amendment) ───────────────────────────
# A review case with `requires_cut: true` expects a verdict only a cut diff yields (WITHHELD for cut code, no finding
# past the cut, a truncation note). On provider P it is cut with review_eval_cut_<P>_max_input_tokens (token budget fit)
# or review_eval_cut_<P>_max_diff_chars (char cap): one of the two. Neither: P's production limits, and a case they
# leave uncut is an errored run. Eval only: production never reads these keys.
# 6300 on both = the Groq production budget: the incidents' own cut, the same prompt on both providers.
review_eval_cut_groq_max_input_tokens:      6300
review_eval_cut_anthropic_max_input_tokens: 6300
anthropic_autofix:               claude-sonnet-5-5
anthropic_autofix_effort:        medium
anthropic_autofix_max_tokens:    16000

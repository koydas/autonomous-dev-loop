name: Code Generation

# Caller of the autonomous-dev-loop pipeline (docs/installation.md of koydas/autonomous-dev-loop).
# Replace <PIPELINE_SHA> with the full commit SHA of the release you install and <PIPELINE_VERSION> with its
# tag (vMAJOR.MINOR.PATCH): that line is the only pin, a branch name is refused at run time.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number
      validate_run_id:
        description: 'Run ID of the validate-issue workflow (for checkpoint resume)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  code-generation:
    permissions:
      # The ai/issue-<n> branch when AI_PR_TOKEN is unset; the `metrics` branch.
      contents: write
      # Opens or updates the pull request, same fallback.
      pull-requests: write
      # gh issue view; needs-human label and comment on escalation.
      issues: write
      # Cross-run checkpoint download from the validate-issue run, and the run lookup (read only).
      actions: read
    uses: koydas/autonomous-dev-loop/.github/workflows/adl-code-generation.yml@<PIPELINE_SHA> # <PIPELINE_VERSION>
    with:
      config_dir: .autonomous-dev-loop
      # Strings: a label event has no inputs.
      issue_number: ${{ format('{0}', inputs.issue_number) }}
      validate_run_id: ${{ format('{0}', inputs.validate_run_id) }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_PR_TOKEN: ${{ secrets.AI_PR_TOKEN }}

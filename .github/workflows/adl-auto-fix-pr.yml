name: ADL Auto-Fix PR (reusable)

# Reusable workflow (ADR-0045): called by auto-fix-pr.yml in this repository and by the caller template of
# a target repository. The triggers (pull_request labeled, issue_comment) belong to the caller; the trust
# check on the comment author stays here, so a caller cannot forget it. The per-PR concurrency group
# (ADR-0020) is on the auto-fix job.
on:
  workflow_call:
    inputs:
      pipeline_repository:
        description: 'Repository holding the pipeline (scripts, prompts, default config)'
        type: string
        default: 'koydas/autonomous-dev-loop'
      pipeline_ref:
        description: 'Self-calls only: the default branch. Any other repository is pinned by the ref of its `uses:` line.'
        type: string
        default: ''
      config_dir:
        description: "Directory of the repository's own pipeline configuration"
        type: string
        default: '.autonomous-dev-loop'
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      AI_PR_TOKEN:
        required: false

# Per job (ADR-0007 amendment 2026-10-20): load-labels runs on every label/comment event and only reads.
permissions:
  contents: read

jobs:
  load-labels:
    runs-on: ubuntu-latest
    env:
      ADL_PIPELINE_REPOSITORY: ${{ inputs.pipeline_repository }}
      ADL_CONFIG_PATH: ${{ inputs.config_dir }}
    permissions:
      contents: read
      # gh api on the PR (head ref for issue_comment events).
      pull-requests: read
      # The run lookup that gives the pipeline commit of an external caller.
      actions: read
    outputs:
      changes_requested: ${{ steps.cfg.outputs.changes_requested }}
      head_ref: ${{ steps.head.outputs.ref }}
      pipeline_ref: ${{ steps.pipeline.outputs.ref }}
    steps:
      - name: Resolve pipeline version
        id: pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPELINE_REPOSITORY: ${{ inputs.pipeline_repository }}
          PIPELINE_REF: ${{ inputs.pipeline_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        # ADR-0045: one pin per caller, the `uses: …@<ref>` of the reusable workflow; its commit is read from the run.
        # A call from the pipeline repository itself runs the default branch, as ADR-0023 requires.
        run: |
          set -euo pipefail
          # pull_request_target runs the base workflow with secrets on the contents of a pull request: never.
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "::error::The pipeline does not run on pull_request_target"
            exit 1
          fi
          if [ "${PIPELINE_REPOSITORY,,}" = "${GITHUB_REPOSITORY,,}" ]; then
            if [ -n "$PIPELINE_REF" ] && [ "$PIPELINE_REF" != "$DEFAULT_BRANCH" ]; then
              echo "::error::pipeline_ref must be the default branch ($DEFAULT_BRANCH) when the pipeline repository calls itself, got $PIPELINE_REF"
              exit 1
            fi
            echo "ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ENTRY=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '[.referenced_workflows[]? | select((.path | ascii_downcase) | startswith((env.PIPELINE_REPOSITORY | ascii_downcase) + "/.github/workflows/adl-"))] | .[0] // empty | [.path, .sha, (.ref // "")] | @tsv')
          if [ -z "$ENTRY" ]; then
            echo "::error::This run does not reference a reusable workflow of $PIPELINE_REPOSITORY"
            exit 1
          fi
          IFS=$'\t' read -r WORKFLOW_PATH SHA REF <<< "$ENTRY"
          PIN="${WORKFLOW_PATH#*@}"
          if ! [[ "$PIN" =~ ^[0-9a-f]{40}$ || "$PIN" =~ ^(refs/tags/)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The reusable workflow is pinned to \"$PIN\": pin a commit SHA or a vMAJOR.MINOR.PATCH tag, never a branch"
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The run does not give the commit of the reusable workflow"
            exit 1
          fi
          # The API reports a tag pinned as `@v1.2.3` with ref `refs/tags/v1.2.3`: compare without the prefix.
          if [ -n "$REF" ] && [ "${REF#refs/tags/}" != "${PIN#refs/tags/}" ]; then
            echo "::error::The run reports the reusable workflow at \"$REF\" but its path pins \"$PIN\""
            exit 1
          fi
          echo "ref=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline_repository }}
          ref: ${{ steps.pipeline.outputs.ref }}
          path: .trusted-pipeline
          persist-credentials: false

      # ADR-0045: the target's own configuration comes from its default branch, never from the ref the run
      # was dispatched on nor from a pull request tree.
      - name: Checkout target configuration (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-config
          sparse-checkout: ${{ inputs.config_dir }}
          persist-credentials: false

      - name: Move the pipeline and the configuration out of the workspace
        run: |
          mv .trusted-pipeline "$RUNNER_TEMP/pipeline"
          mv .trusted-config "$RUNNER_TEMP/target-config"
          echo "ADL_CONFIG_DIR=$RUNNER_TEMP/target-config/$ADL_CONFIG_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: cfg
        run: node "$RUNNER_TEMP/pipeline/scripts/resolve_labels.mjs" review.changes.name changes_requested
      # issue_comment payloads carry no head ref; the shared concurrency group needs it.
      # Same conditions as the auto-fix job's issue_comment branch: no lookup for other comments.
      - id: head
        if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(github.event.comment.body, '- [x] Relancer Auto Fixer') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_API_URL: ${{ github.event.issue.pull_request.url }}
        # Fail closed: an empty ref would put the job in the global group `pr-pipeline-`.
        run: |
          REF=$(gh api "$PR_API_URL" --jq '.head.ref')
          [ -n "$REF" ] || { echo "::error::Could not resolve PR head ref"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  auto-fix:
    needs: load-labels
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == needs.load-labels.outputs.changes_requested) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(github.event.comment.body, '- [x] Relancer Auto Fixer')) }}
    runs-on: ubuntu-latest
    env:
      ADL_PIPELINE_REPOSITORY: ${{ inputs.pipeline_repository }}
      ADL_CONFIG_PATH: ${{ inputs.config_dir }}
    # 15 Groq retries x 60 s + 5 min for checkout, push and labels (ADR-0028).
    timeout-minutes: 20
    permissions:
      # git push to the PR branch when AI_PR_TOKEN is unset, and the `metrics` branch (Commit metrics).
      contents: write
      # Kept: labels on the PR through the issues API (auto_fix_pr.mjs, this token); issues: write may suffice.
      pull-requests: write
      # Attempt / needs-human labels and comments (auto_fix_pr.mjs, this token).
      issues: write
      # Checkpoint artifact list and download (read only).
      actions: read
    # Job-level: every PR comment/label triggers this workflow; a workflow-level group
    # would let skipped runs displace the pending real one. Never cancel: this job pushes.
    # Shared with pr-review and reset-auto-fix (ADR-0020).
    concurrency:
      group: pr-pipeline-${{ github.event.pull_request.head.ref || needs.load-labels.outputs.head_ref }}
      cancel-in-progress: false

    steps:
      - name: Resolve PR payload for issue_comment
        if: ${{ github.event_name == 'issue_comment' }}
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AI_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR_API_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          PAYLOAD=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${PR_API_URL}")
          echo "head_ref=$(echo "${PAYLOAD}" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || steps.pr.outputs.head_ref }}
          token: ${{ secrets.AI_PR_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ADR-0023, ADR-0045: pipeline code runs from the pinned pipeline; the branch above is data only.
      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline_repository }}
          ref: ${{ needs.load-labels.outputs.pipeline_ref }}
          path: .trusted-pipeline
          persist-credentials: false

      # ADR-0045: the target's own configuration comes from its default branch, never from the ref the run
      # was dispatched on nor from a pull request tree.
      - name: Checkout target configuration (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-config
          sparse-checkout: ${{ inputs.config_dir }}
          persist-credentials: false

      - name: Move the pipeline and the configuration out of the workspace
        run: |
          mv .trusted-pipeline "$RUNNER_TEMP/pipeline"
          mv .trusted-config "$RUNNER_TEMP/target-config"
          echo "ADL_CONFIG_DIR=$RUNNER_TEMP/target-config/$ADL_CONFIG_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download checkpoint artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          ARTIFACT_NAME="checkpoints-pr-${PR_NUMBER}"
          ARTIFACT_URL=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1" \
            --jq '[.artifacts[] | select(.expired == false)] | .[0].archive_download_url // ""' \
            2>/dev/null || echo "")
          if [ -n "$ARTIFACT_URL" ]; then
            mkdir -p ./checkpoints
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "${ARTIFACT_URL}" -o /tmp/checkpoint.zip
            unzip -o /tmp/checkpoint.zip -d ./checkpoints/
            rm -f /tmp/checkpoint.zip
          else
            echo "No checkpoint artifact found for ${ARTIFACT_NAME}"
          fi

      - name: Check prerequisite checkpoint
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          RUNID="pr-${PR_NUMBER}"
          if [ ! -f "./checkpoints/${RUNID}/review.json" ]; then
            echo "::error::Checkpoint 'review' not found for run '${RUNID}'. The pr-review workflow must complete successfully before auto-fix can proceed."
            exit 1
          fi

      - name: Apply AI fixes
        id: fix
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          METRICS_FILE: ${{ runner.temp }}/pipeline-metrics.jsonl
          # ADR-0028: a Groq rate limit (429, or 413 rate_limit_exceeded) is waited out, never fatal.
          # Hint-less limits wait one 60 s TPM window; retries × wait ≤ timeout-minutes − 3 min.
          LLM_MAX_RETRY_WAIT_MS: '60000'
          GROQ_MAX_RETRIES: '15'
          CHECKPOINT_RUN_ID: pr-${{ github.event.pull_request.number || github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_PROVIDER_AUTOFIX: ${{ vars.AI_PROVIDER_AUTOFIX }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_URL: ${{ vars.GROQ_API_URL }}
          GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT }}
        run: node "$RUNNER_TEMP/pipeline/scripts/auto_fix_pr.mjs"

      - name: Upload checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoints-pr-${{ github.event.pull_request.number || github.event.issue.number }}
          path: ./checkpoints
          if-no-files-found: ignore
          overwrite: true

      - name: Commit and push fixes
        id: push
        if: steps.fix.outputs.fixed_paths != ''
        env:
          PR_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || steps.pr.outputs.head_ref }}
          ATTEMPT: ${{ steps.fix.outputs.attempt_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset HEAD -- metrics/
          git diff --staged --quiet || git commit -m "fix(ai): auto-fix attempt ${ATTEMPT}"
          git push origin HEAD:"${PR_BRANCH}"

      - name: Upload run trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-trace-${{ github.run_id }}
          path: ./observability/traces/${{ github.run_id }}.json
          if-no-files-found: ignore
          overwrite: true

      - name: Commit metrics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only this run's records, written outside the checkout (ADR-0021): never the
          # working-tree metrics/runs.jsonl, which generated code could have modified.
          METRICS_FILE: ${{ runner.temp }}/pipeline-metrics.jsonl
          RUN_RECORD_MESSAGE: "metrics: pr ${{ github.event.pull_request.number || github.event.issue.number }} auto-fix [skip ci]"
          RUN_RECORD_PUSH_OUTCOME: ${{ steps.push.outcome }}
          RUN_RECORD_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        # One commit on the `metrics` branch, never main (PR-only; ADR-0013 amendment): the
        # runs.jsonl lines + the redacted run record metrics/runs/<YYYY-MM>/<run_id>-<attempt>.json (ADR-0040).
        # The trusted copy is the default branch: until it ships the script, a warning, not a red job.
        run: |
          SCRIPT="$RUNNER_TEMP/pipeline/scripts/commit_run_record.mjs"
          [ -f "$SCRIPT" ] || { echo "::warning::commit_run_record.mjs is not on the default branch yet; metrics not committed"; exit 0; }
          node "$SCRIPT"

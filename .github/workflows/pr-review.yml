name: PR Review

# Thin caller (ADR-0045): the body is adl-pr-review.yml. The name, the triggers, the per-PR concurrency
# group and the permission ceiling stay here; this repository runs its own pipeline from its default branch
# (ADR-0023).
on:
  push:
    # main never has an open PR to review: skip it instead of paying for the evidence job.
    branches: ["**", "!main"]
  pull_request:
    types: [opened]

# Per job (ADR-0007 amendment 2026-10-20): the default here is read-only; the called jobs grant what they call.
permissions:
  contents: read

# Shared with auto-fix-pr and reset-auto-fix (ADR-0020): one pipeline stage per PR branch at a time. On the
# caller, so it covers the whole run (evidence and review); the reusable workflow declares none, which would
# make the called jobs wait for this very group.
concurrency:
  group: pr-pipeline-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  pr-review:
    permissions:
      # The `metrics` branch only (Commit metrics, Git Data API).
      contents: write
      # Review submit; pr_review.mjs uses AI_PR_TOKEN, the workflow token when it is unset.
      pull-requests: write
      # Labels and the review comment, same fallback.
      issues: write
      # gh run list, the auto-fix run check, the cross-run checkpoint download and the run lookup (read only).
      actions: read
    uses: ./.github/workflows/adl-pr-review.yml
    with:
      pipeline_repository: ${{ github.repository }}
      pipeline_ref: ${{ github.event.repository.default_branch }}
      config_dir: config
      autofix_workflow_file: auto-fix-pr.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_PR_TOKEN: ${{ secrets.AI_PR_TOKEN }}

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/tests/*.test.mjs

      # #198: every literal event name emitted under scripts/ has a row in docs/observability.md.
      - name: Check observability event docs
        run: node scripts/check_event_docs.mjs

      # One list for every c8 gate, config/coverage-gates.json (AGENTS.md → Test Coverage Policy). Every gate runs; a
      # failure is named in the log: `node scripts/coverage_gates.mjs --only scripts/lib/<module>.mjs` reproduces it.
      - name: Check coverage gates (≥80%)
        run: node scripts/coverage_gates.mjs

  # ADR-0039: the LangGraph prototype's Python tests, which node --test does not run.
  # 3.11 is the declared minimum; read-only token and no secrets (generated code runs here).
  prototype-langgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: prototypes/langgraph-loop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest -v tests.test_loop

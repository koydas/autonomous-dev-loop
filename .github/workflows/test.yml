            --branches 80 \
            --functions 80 \
            --statements 80 \
            node --test scripts/tests/run_record.test.mjs

      # ADR-0041: trace identity (untrusted PR text) and the OTLP span tree of the public record.
      - name: Check trace_context coverage (≥80%)
        run: |
          npx --yes c8 \
            --include 'scripts/lib/trace_context.mjs' \
            --check-coverage \

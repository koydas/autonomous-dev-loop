name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/tests/*.test.mjs

      # #198: every literal event name emitted under scripts/ has a row in docs/observability.md.
      - name: Check observability event docs
        run: node scripts/check_event_docs.mjs

      - name: Check checkpoint coverage (≥80%)
        run: |
          npx --yes c8 \
            --include 'scripts/lib/checkpoint.mjs' \
            --check-coverage \
            --lines 80 \
            --branches 80 \
            --functions 80 \
            --statements 80 \
            node --test scripts/tests/checkpoint.test.mjs

      - name: Check config coverage (≥80%)
        run: |
          npx --yes c8 \
            --include 'scripts/lib/config.mjs' \
            --check-coverage \
            --lines 80 \
            --branches 80 \
            --functions 80 \
            --statements 80 \
            node --test scripts/tests/config.test.mjs

      - name: Check llm_client coverage (≥80%)
        run: |
          npx --yes c8 \
            --include 'scripts/lib/llm_client.mjs' \
            --check-coverage \
            --lines 80 \
            --branches 80 \
            --functions 80 \
            --statements 80 \
            node --test scripts/tests/llm_client.test.mjs

      - name: Check anthropic_client coverage (≥80%)
        run: |
          npx --yes c8 \
            --include 'scripts/lib/anthropic_client.mjs' \
            --check-coverage \
            --lines 80 \
            --branches 80 \
            --functions 80 \
            --statements 80 \
            node --test scripts/tests/anthropic_client.test.mjs

      - name: Check groq_client coverage (≥80%)
        run: |
          npx --yes c8 \
            --include 'scripts/lib/groq_client.mjs' \
            --check-coverage \
            --lines 80 \
            --branches 80 \
            --functions 80 \
            --statements 80 \
            node --test scripts/tests/groq_client.test.mjs

      - name: Check review_evidence coverage (≥80%)
        run: |
          npx --yes c8 \
            --include 'scripts/lib/review_evidence.mjs' \
            --check-coverage \
            --lines 80 \
            --branches 80 \

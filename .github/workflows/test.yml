            node --test scripts/tests/generation_blocked.test.mjs

      # ADR-0040 public-safety contract: the journal scrubs at the source, redactTrace() is the only path to `metrics`.
      - name: Check run_journal coverage (≥80%)
        run: |
          npx --yes c8 \
            --include 'scripts/lib/run_journal.mjs' \
            --check-coverage \

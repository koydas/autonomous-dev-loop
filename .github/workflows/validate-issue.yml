name: Issue Validation Agent

# Thin caller (ADR-0045): the body is adl-validate-issue.yml. The name, the trigger and the permission
# ceiling stay here; this repository runs its own pipeline from its default branch (ADR-0023).
on:
  issues:
    types: [opened, edited]

# Per job (ADR-0007 amendment 2026-10-20).
permissions:
  contents: read

jobs:
  validate:
    permissions:
      # The `metrics` branch only (Commit metrics, Git Data API).
      contents: write
      # Validation comment and labels.
      issues: write
      # gh workflow run code-generation.yml: a dispatch is the one call that needs actions: write.
      actions: write
    uses: ./.github/workflows/adl-validate-issue.yml
    with:
      pipeline_repository: ${{ github.repository }}
      pipeline_ref: ${{ github.event.repository.default_branch }}
      config_dir: config
      codegen_workflow_file: code-generation.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

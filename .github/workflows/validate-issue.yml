name: Issue Validation Agent

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: validate-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    # 12 Groq retries x 60 s + 3 min for the comment and labels (ADR-0028).
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download checkpoint artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: checkpoints-issue-${{ github.event.issue.number }}
          path: ./checkpoints

      - name: Validate issue
        id: validate
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          METRICS_FILE: ${{ runner.temp }}/pipeline-metrics.jsonl
          # ADR-0028: a Groq rate limit (429, or 413 rate_limit_exceeded) is waited out, never fatal.
          # Hint-less limits wait one 60 s TPM window; retries × wait ≤ timeout-minutes − 3 min.
          LLM_MAX_RETRY_WAIT_MS: '60000'
          GROQ_MAX_RETRIES: '12'
          CHECKPOINT_RUN_ID: issue-${{ github.event.issue.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_URL: ${{ vars.GROQ_API_URL }}
          GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT }}
        run: node scripts/validate_issue.mjs

      - name: Upsert validation comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMENT_BODY: ${{ steps.validate.outputs.comment }}
        run: node scripts/upsert_issue_validation_comment.mjs

      - name: Manage labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IS_VALID: ${{ steps.validate.outputs.valid }}
        run: node scripts/manage_labels.mjs

      - name: Upload checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoints-issue-${{ github.event.issue.number }}
          path: ./checkpoints
          if-no-files-found: ignore
          overwrite: true

      - name: Upload run trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-trace-${{ github.run_id }}
          path: ./observability/traces/${{ github.run_id }}.json
          if-no-files-found: ignore
          overwrite: true

      - name: Commit metrics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_FILE: ${{ runner.temp }}/pipeline-metrics.jsonl
        run: |
          # Only this run's records, written outside the checkout (ADR-0021): never the
          # working-tree metrics/runs.jsonl, which generated code could have modified.
          NEW_LINES=$(cat "$METRICS_FILE" 2>/dev/null || true)
          [ -z "$NEW_LINES" ] && exit 0
          UPLOADED=0
          for i in 1 2 3; do
            RESP=$(gh api "repos/$GITHUB_REPOSITORY/contents/metrics/runs.jsonl" 2>/dev/null || echo '{}')
            SHA=$(echo "$RESP" | jq -r '.sha // empty')
            CURRENT=$(echo "$RESP" | jq -r '.content // ""' | tr -d '\n' | base64 -d 2>/dev/null || true)
            [ -n "$CURRENT" ] && CURRENT="${CURRENT}"$'\n'
            NEW_B64=$(printf "%s" "${CURRENT}${NEW_LINES}"$'\n' | base64 -w0)
            jq -nc --arg m "metrics: issue ${{ github.event.issue.number }} [skip ci]" \
              --arg c "$NEW_B64" --arg s "$SHA" \
              '{message:$m,content:$c}+if $s!="" then {sha:$s} else {} end' \
              | gh api "repos/$GITHUB_REPOSITORY/contents/metrics/runs.jsonl" -X PUT --input - \
              && { UPLOADED=1; break; } || sleep $((2**i))
          done
          [ "$UPLOADED" -eq 1 ] || echo "::warning::Failed to commit metrics after 3 attempts; data may be lost"

      - name: Trigger Code Generation
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run code-generation.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f issue_number=${{ github.event.issue.number }} \
            -f validate_run_id=${{ github.run_id }}

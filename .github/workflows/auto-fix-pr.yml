name: Auto-Fix PR

# Thin caller (ADR-0045): the body is adl-auto-fix-pr.yml. The name, the triggers and the permission ceiling
# stay here; the per-PR concurrency group (ADR-0020) and the trust check on the comment author are in the
# body. This repository runs its own pipeline from its default branch (ADR-0023).
on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created, edited]

# Per job (ADR-0007 amendment 2026-10-20): the called load-labels job runs on every label/comment event and only reads.
permissions:
  contents: read

jobs:
  auto-fix:
    permissions:
      # git push to the PR branch when AI_PR_TOKEN is unset, and the `metrics` branch (Commit metrics).
      contents: write
      # Kept: labels on the PR through the issues API (auto_fix_pr.mjs, this token); issues: write may suffice.
      pull-requests: write
      # Attempt / needs-human labels and comments (auto_fix_pr.mjs, this token).
      issues: write
      # Checkpoint artifact list and download, and the run lookup (read only).
      actions: read
    uses: ./.github/workflows/adl-auto-fix-pr.yml
    with:
      pipeline_repository: ${{ github.repository }}
      pipeline_ref: ${{ github.event.repository.default_branch }}
      config_dir: config
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_PR_TOKEN: ${{ secrets.AI_PR_TOKEN }}

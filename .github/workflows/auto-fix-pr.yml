name: Auto-Fix PR

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  load-labels:
    runs-on: ubuntu-latest
    outputs:
      changes_requested: ${{ steps.cfg.outputs.changes_requested }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: cfg
        run: |
          LABEL=$(node --input-type=module <<'EOF'
          import { readFileSync } from 'fs';
          import { parseNestedYaml } from './scripts/lib/yaml.mjs';
          process.stdout.write(parseNestedYaml(readFileSync('config/labels.yaml', 'utf8')).review.changes.name);
          EOF
          )
          echo "changes_requested=$LABEL" >> "$GITHUB_OUTPUT"

  auto-fix:
    needs: load-labels
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == needs.load-labels.outputs.changes_requested) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '- [x] Relancer Auto Fixer')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve PR payload for issue_comment
        if: ${{ github.event_name == 'issue_comment' }}
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AI_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR_API_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          PAYLOAD=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${PR_API_URL}")
          echo "head_ref=$(echo "${PAYLOAD}" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "payload=${PAYLOAD}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || steps.pr.outputs.head_ref }}
          token: ${{ secrets.AI_PR_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find latest PR review run for checkpoint
        id: review_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"
          else
            BRANCH="${{ steps.pr.outputs.head_ref }}"
          fi
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow pr-review.yml \
            --branch "$BRANCH" \
            --status completed \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")] | .[0].databaseId // ""' 2>/dev/null || echo "")
          echo "id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download checkpoint artifact
        if: steps.review_run.outputs.id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: checkpoints-pr-${{ github.event.pull_request.number || github.event.issue.number }}
          run-id: ${{ steps.review_run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./checkpoints

      - name: Check prerequisite checkpoint
        run: |
          RUNID="pr-${{ github.event.pull_request.number || github.event.issue.number }}"
          if [ ! -f "./checkpoints/${RUNID}/review.json" ]; then
            echo "::error::Checkpoint 'review' not found for run '${RUNID}'. The pr-review workflow must complete successfully before auto-fix can proceed."
            exit 1
          fi

      - name: Capture metrics baseline
        id: mbl
        run: echo "count=$(wc -l < metrics/runs.jsonl 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Apply AI fixes
        id: fix
        env:
          CHECKPOINT_RUN_ID: pr-${{ github.event.pull_request.number || github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_URL: ${{ vars.GROQ_API_URL }}
        run: node scripts/auto_fix_pr.mjs

      - name: Upload checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoints-pr-${{ github.event.pull_request.number || github.event.issue.number }}
          path: ./checkpoints
          if-no-files-found: ignore
          overwrite: true

      - name: Commit and push fixes
        if: steps.fix.outputs.fixed_paths != ''
        env:
          PR_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || steps.pr.outputs.head_ref }}
          ATTEMPT: ${{ steps.fix.outputs.attempt_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset HEAD -- metrics/
          git diff --staged --quiet || git commit -m "fix(ai): auto-fix attempt ${ATTEMPT}"
          git push origin HEAD:"${PR_BRANCH}"

      - name: Commit metrics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE: ${{ steps.mbl.outputs.count }}
        run: |
          NEW_LINES=$(tail -n +$((BASELINE + 1)) metrics/runs.jsonl 2>/dev/null || true)
          [ -z "$NEW_LINES" ] && exit 0
          UPLOADED=0
          for i in 1 2 3; do
            RESP=$(gh api "repos/$GITHUB_REPOSITORY/contents/metrics/runs.jsonl" 2>/dev/null || echo '{}')
            SHA=$(echo "$RESP" | jq -r '.sha // empty')
            CURRENT=$(echo "$RESP" | jq -r '.content // ""' | tr -d '\n' | base64 -d 2>/dev/null || true)
            [ -n "$CURRENT" ] && CURRENT="${CURRENT}"$'\n'
            NEW_B64=$(printf "%s" "${CURRENT}${NEW_LINES}"$'\n' | base64 -w0)
            jq -nc --arg m "metrics: pr ${{ github.event.pull_request.number || github.event.issue.number }} auto-fix [skip ci]" \
              --arg c "$NEW_B64" --arg s "$SHA" \
              '{message:$m,content:$c}+if $s!="" then {sha:$s} else {} end' \
              | gh api "repos/$GITHUB_REPOSITORY/contents/metrics/runs.jsonl" -X PUT --input - \
              && { UPLOADED=1; break; } || sleep $((2**i))
          done
          [ "$UPLOADED" -eq 1 ] || echo "::warning::Failed to commit metrics after 3 attempts; data may be lost"

name: ADL Code Generation (reusable)

# Reusable workflow (ADR-0045): called by code-generation.yml in this repository and by the caller
# template of a target repository. The triggers (issues labeled, workflow_dispatch) belong to the caller.
on:
  workflow_call:
    inputs:
      pipeline_repository:
        description: 'Repository holding the pipeline (scripts, prompts, default config)'
        type: string
        default: 'koydas/autonomous-dev-loop'
      pipeline_ref:
        description: 'Self-calls only: the default branch. Any other repository is pinned by the ref of its `uses:` line.'
        type: string
        default: ''
      config_dir:
        description: "Directory of the repository's own pipeline configuration"
        type: string
        default: '.autonomous-dev-loop'
      issue_number:
        description: 'Issue number to process (workflow_dispatch of the caller; empty on a label event)'
        type: string
        default: ''
      validate_run_id:
        description: 'Run ID of the validate-issue workflow (for checkpoint resume)'
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      AI_PR_TOKEN:
        required: false

# Per job (ADR-0007 amendment 2026-10-20): load-labels runs on every issue label event and only reads.
permissions:
  contents: read

jobs:
  load-labels:
    runs-on: ubuntu-latest
    env:
      ADL_PIPELINE_REPOSITORY: ${{ inputs.pipeline_repository }}
      ADL_CONFIG_PATH: ${{ inputs.config_dir }}
    permissions:
      contents: read
      # The run lookup that gives the pipeline commit of an external caller.
      actions: read
    outputs:
      ready_for_dev: ${{ steps.cfg.outputs.ready_for_dev }}
      pipeline_ref: ${{ steps.pipeline.outputs.ref }}
    steps:
      - name: Resolve pipeline version
        id: pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPELINE_REPOSITORY: ${{ inputs.pipeline_repository }}
          PIPELINE_REF: ${{ inputs.pipeline_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        # ADR-0045: one pin per caller, the `uses: …@<ref>` of the reusable workflow; its commit is read from the run.
        # A call from the pipeline repository itself runs the default branch, as ADR-0023 requires.
        run: |
          set -euo pipefail
          # pull_request_target runs the base workflow with secrets on the contents of a pull request: never.
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "::error::The pipeline does not run on pull_request_target"
            exit 1
          fi
          if [ "${PIPELINE_REPOSITORY,,}" = "${GITHUB_REPOSITORY,,}" ]; then
            if [ -n "$PIPELINE_REF" ] && [ "$PIPELINE_REF" != "$DEFAULT_BRANCH" ]; then
              echo "::error::pipeline_ref must be the default branch ($DEFAULT_BRANCH) when the pipeline repository calls itself, got $PIPELINE_REF"
              exit 1
            fi
            echo "ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ENTRY=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '[.referenced_workflows[]? | select((.path | ascii_downcase) | startswith((env.PIPELINE_REPOSITORY | ascii_downcase) + "/.github/workflows/adl-"))] | .[0] // empty | [.path, .sha, (.ref // "")] | @tsv')
          if [ -z "$ENTRY" ]; then
            echo "::error::This run does not reference a reusable workflow of $PIPELINE_REPOSITORY"
            exit 1
          fi
          IFS=$'\t' read -r WORKFLOW_PATH SHA REF <<< "$ENTRY"
          PIN="${WORKFLOW_PATH#*@}"
          if ! [[ "$PIN" =~ ^[0-9a-f]{40}$ || "$PIN" =~ ^(refs/tags/)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The reusable workflow is pinned to \"$PIN\": pin a commit SHA or a vMAJOR.MINOR.PATCH tag, never a branch"
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The run does not give the commit of the reusable workflow"
            exit 1
          fi
          # The API reports a tag pinned as `@v1.2.3` with ref `refs/tags/v1.2.3`: compare without the prefix.
          if [ -n "$REF" ] && [ "${REF#refs/tags/}" != "${PIN#refs/tags/}" ]; then
            echo "::error::The run reports the reusable workflow at \"$REF\" but its path pins \"$PIN\""
            exit 1
          fi
          echo "ref=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline_repository }}
          ref: ${{ steps.pipeline.outputs.ref }}
          path: .trusted-pipeline
          persist-credentials: false

      # ADR-0045: the target's own configuration comes from its default branch, never from the ref the run
      # was dispatched on nor from a pull request tree.
      - name: Checkout target configuration (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-config
          sparse-checkout: ${{ inputs.config_dir }}
          persist-credentials: false

      - name: Move the pipeline and the configuration out of the workspace
        run: |
          mv .trusted-pipeline "$RUNNER_TEMP/pipeline"
          mv .trusted-config "$RUNNER_TEMP/target-config"
          echo "ADL_CONFIG_DIR=$RUNNER_TEMP/target-config/$ADL_CONFIG_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: cfg
        run: node "$RUNNER_TEMP/pipeline/scripts/resolve_labels.mjs" issue.valid.name ready_for_dev

  generate-pr:
    needs: load-labels
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == needs.load-labels.outputs.ready_for_dev
    runs-on: ubuntu-latest
    env:
      ADL_PIPELINE_REPOSITORY: ${{ inputs.pipeline_repository }}
      ADL_CONFIG_PATH: ${{ inputs.config_dir }}
    # 15 Groq retries x 60 s + 5 min for checkout, PR creation and artifacts (ADR-0028).
    timeout-minutes: 20
    permissions:
      # create-pull-request pushes ai/issue-<n> when AI_PR_TOKEN is unset; the `metrics` branch (Commit metrics).
      contents: write
      # create-pull-request opens / updates the PR, same fallback.
      pull-requests: write
      # gh issue view; needs-human label and comment on escalation (generate_issue_change.mjs, this token).
      issues: write
      # Cross-run checkpoint download from the validate-issue run (read only).
      actions: read
    # Job-level: any label added to the issue triggers this workflow (see auto-fix-pr.yml).
    concurrency:
      group: code-generation-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false

    steps:
      # Nothing here runs git push: create-pull-request sets its own token for its push.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline_repository }}
          ref: ${{ needs.load-labels.outputs.pipeline_ref }}
          path: .trusted-pipeline
          persist-credentials: false

      # ADR-0045: the target's own configuration comes from its default branch, never from the ref the run
      # was dispatched on nor from a pull request tree.
      - name: Checkout target configuration (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-config
          sparse-checkout: ${{ inputs.config_dir }}
          persist-credentials: false

      - name: Move the pipeline and the configuration out of the workspace
        run: |
          mv .trusted-pipeline "$RUNNER_TEMP/pipeline"
          mv .trusted-config "$RUNNER_TEMP/target-config"
          echo "ADL_CONFIG_DIR=$RUNNER_TEMP/target-config/$ADL_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve issue data
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_NUMBER: ${{ inputs.issue_number }}
          EVENT_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NUMBER="$INPUT_NUMBER"
          else
            NUMBER="$EVENT_NUMBER"
          fi
          TITLE=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q '.title')
          LABELS=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels | map(.name) | tojson')
          # Issue text is untrusted: random heredoc delimiter per run, so a body line cannot close the
          # block and forge outputs (audit F28); number/labels written last (last value wins).
          DELIM="ghadelim_$(openssl rand -hex 16)"
          {
            echo "body<<$DELIM"
            gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q '.body'
            echo "$DELIM"
            echo "title<<$DELIM"
            printf '%s\n' "$TITLE"
            echo "$DELIM"
            echo "number=$NUMBER"
            echo "labels=$LABELS"
          } >> "$GITHUB_OUTPUT"

      - name: Download checkpoint artifact
        if: inputs.validate_run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: checkpoints-issue-${{ steps.issue.outputs.number }}
          run-id: ${{ inputs.validate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./checkpoints

      - name: Check prerequisite checkpoint
        if: inputs.validate_run_id != ''
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          RUNID="issue-${ISSUE_NUMBER}"
          if [ ! -f "./checkpoints/${RUNID}/validate.json" ]; then
            echo "::error::Checkpoint 'validate' not found for run '${RUNID}'. The validate-issue job must complete successfully before code-generation can proceed."
            exit 1
          fi

      - name: Generate AI change
        id: generate
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          # ADR-0028: a Groq rate limit (429, or 413 rate_limit_exceeded) is waited out, never fatal.
          # Hint-less limits wait one 60 s TPM window; retries × wait ≤ timeout-minutes − 3 min.
          LLM_MAX_RETRY_WAIT_MS: '60000'
          GROQ_MAX_RETRIES: '15'
          CHECKPOINT_RUN_ID: issue-${{ steps.issue.outputs.number }}
          METRICS_FILE: ${{ runner.temp }}/pipeline-metrics.jsonl
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_PROVIDER_GENERATION: ${{ vars.AI_PROVIDER_GENERATION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_URL: ${{ vars.GROQ_API_URL }}
          GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT }}
        run: node "$RUNNER_TEMP/pipeline/scripts/generate_issue_change.mjs"

      # A guardrail rejection (ADR-0019) exits 0 with rejected=true, a blocked issue (ADR-0029
      # amendment) with blocked=true: nothing was written, no branch is pushed, no PR is opened.
      - name: Create pull request
        id: cpr
        if: steps.generate.outputs.rejected != 'true' && steps.generate.outputs.blocked != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.AI_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: ai/issue-${{ steps.issue.outputs.number }}
          base: ${{ github.event.repository.default_branch }}
          commit-message: "chore(ai): generate draft for issue #${{ steps.issue.outputs.number }}"
          title: "[AI] Issue #${{ steps.issue.outputs.number }}: ${{ steps.issue.outputs.title }}"
          body: |
            ## AI Generated Change

            ${{ steps.generate.outputs.summary }}

            Closes #${{ steps.issue.outputs.number }}
          add-paths: |
            ${{ steps.generate.outputs.generated_paths }}

      - name: Upload checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoints-issue-${{ steps.issue.outputs.number }}
          path: ./checkpoints
          if-no-files-found: ignore
          overwrite: true

      - name: Upload run trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-trace-${{ github.run_id }}
          path: ./observability/traces/${{ github.run_id }}.json
          if-no-files-found: ignore
          overwrite: true

      - name: Commit metrics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only this run's records, written outside the checkout (ADR-0021): never the
          # working-tree metrics/runs.jsonl, which generated code could have modified.
          METRICS_FILE: ${{ runner.temp }}/pipeline-metrics.jsonl
          RUN_RECORD_MESSAGE: "metrics: issue ${{ steps.issue.outputs.number }} code-generation [skip ci]"
          RUN_RECORD_PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          RUN_RECORD_PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          RUN_RECORD_PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        # One commit on the `metrics` branch, never main (PR-only; ADR-0013 amendment): the
        # runs.jsonl lines + the redacted run record metrics/runs/<YYYY-MM>/<run_id>-<attempt>.json (ADR-0040).
        run: node "$RUNNER_TEMP/pipeline/scripts/commit_run_record.mjs"

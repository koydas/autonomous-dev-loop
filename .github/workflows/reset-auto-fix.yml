name: Reset Auto-Fix Counter

# Thin caller (ADR-0045): the body is adl-reset-auto-fix.yml. The name, the trigger and the permission
# ceiling stay here; this repository runs its own pipeline from its default branch (ADR-0023).
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to reset'
        required: true
        type: number
      retrigger:
        description: 'Re-apply changes-requested to trigger a new auto-fix cycle'
        required: false
        type: boolean
        default: true

# Per job (ADR-0007 amendment 2026-10-20).
permissions:
  contents: read

jobs:
  reset-auto-fix:
    permissions:
      # Label removal / re-apply on the PR (reset_auto_fix.mjs, AI_PR_TOKEN or the workflow token).
      pull-requests: write
      issues: write
      # The `metrics` branch only (Commit metrics step, ADR-0040, ADR-0041).
      contents: write
      # The run lookup that gives the pipeline commit of an external caller (read only).
      actions: read
    uses: ./.github/workflows/adl-reset-auto-fix.yml
    with:
      pipeline_repository: ${{ github.repository }}
      pipeline_ref: ${{ github.event.repository.default_branch }}
      config_dir: config
      pr_number: ${{ inputs.pr_number }}
      retrigger: ${{ inputs.retrigger }}
    secrets:
      AI_PR_TOKEN: ${{ secrets.AI_PR_TOKEN }}

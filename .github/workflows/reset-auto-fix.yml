name: Reset Auto-Fix Counter

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to reset'
        required: true
        type: number
      retrigger:
        description: 'Re-apply changes-requested to trigger a new auto-fix cycle'
        required: false
        type: boolean
        default: true

permissions:
  pull-requests: write
  issues: write
  # The `metrics` branch only (Commit metrics step, ADR-0040).
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      head_ref: ${{ steps.head.outputs.ref }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        # Fail closed: an empty ref would put the job in the global group `pr-pipeline-`.
        run: |
          REF=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.ref')
          [ -n "$REF" ] || { echo "::error::Could not resolve PR head ref"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  reset:
    needs: resolve
    runs-on: ubuntu-latest
    # Shared with pr-review and auto-fix-pr (ADR-0020): never reset labels mid auto-fix run.
    concurrency:
      group: pr-pipeline-${{ needs.resolve.outputs.head_ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reset auto-fix attempt labels
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.AI_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RETRIGGER: ${{ inputs.retrigger }}
        run: node scripts/reset_auto_fix.mjs

      - name: Upload run trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-trace-${{ github.run_id }}
          path: ./observability/traces/${{ github.run_id }}.json
          if-no-files-found: ignore
          overwrite: true

      # ADR-0041: the reset joins the trace of the PR's work item — record + trace index on `metrics`
      # (ADR-0040). The checkout is the dispatching ref: no PR code runs here.
      - name: Commit metrics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_RECORD_MESSAGE: "metrics: pr ${{ inputs.pr_number }} reset-auto-fix [skip ci]"
        run: node scripts/commit_run_record.mjs

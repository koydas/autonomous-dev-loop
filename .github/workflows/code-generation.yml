name: Code Generation

# Thin caller (ADR-0045): the body is adl-code-generation.yml. The name, the triggers and the permission
# ceiling stay here; this repository runs its own pipeline from its default branch (ADR-0023).
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number
      validate_run_id:
        description: 'Run ID of the validate-issue workflow (for checkpoint resume)'
        required: false
        type: string

# Per job (ADR-0007 amendment 2026-10-20): the reusable workflow's load-labels job runs on every issue label event and only reads.
permissions:
  contents: read

jobs:
  code-generation:
    permissions:
      # create-pull-request pushes ai/issue-<n> when AI_PR_TOKEN is unset; the `metrics` branch (Commit metrics).
      contents: write
      # create-pull-request opens / updates the PR, same fallback.
      pull-requests: write
      # gh issue view; needs-human label and comment on escalation.
      issues: write
      # Cross-run checkpoint download from the validate-issue run, and the run lookup (read only).
      actions: read
    uses: ./.github/workflows/adl-code-generation.yml
    with:
      pipeline_repository: ${{ github.repository }}
      pipeline_ref: ${{ github.event.repository.default_branch }}
      config_dir: config
      # Strings: a label event has no inputs.
      issue_number: ${{ format('{0}', inputs.issue_number) }}
      validate_run_id: ${{ format('{0}', inputs.validate_run_id) }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_PR_TOKEN: ${{ secrets.AI_PR_TOKEN }}

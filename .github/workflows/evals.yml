name: Evals

# Manual, plus a weekly run of each suite: each run spends real LLM tokens (Groq free tier: 8K TPM).
# With `publish`, a run on the default branch is added to the eval dashboard on
# GitHub Pages (ADR-0027 amendment): the `publish` job reads the history back from the
# deployed site, adds the run and redeploys. Nothing is committed. Runs on other refs
# stay artifact-only.
#
# Weekly (ADR-0027 amendments): eval-replay.yml and pr-evals.yml compare with the last published
# run, which goes stale without a regular one. Every registered suite once a week, repeats 3, one
# suite per scheduled run: one suite × 3 fills most of the Groq free-tier 200k TPD, two in a row do
# not fit (run 38271632735). On `schedule` every input is empty: the defaults below are explicit
# (publish on, init_site off, no restore); workflow_gates.test.mjs pins them.
on:
  schedule:
    # 06:23 UTC, off the hour (GitHub delays :00 schedules). One cron per suite, 48 h apart so a
    # delayed schedule still starts on a TPD the previous suite no longer holds. The `suite` matrix
    # maps each cron string to its suite.
    - cron: '23 6 * * 1' # validation, ≈ 18 min
    - cron: '23 6 * * 3' # review, ≈ 35-40 min
  workflow_dispatch:
    inputs:
      suite:
        description: Eval suite (see scripts/lib/eval_suites.mjs). review ≈ 11 min per repeat on the Groq free tier
        type: choice
        required: true
        default: validation
        options:
          - validation
          - review
      repeats:
        description: Runs per case (>1 measures consistency)
        required: true
        default: '3'
      # Issue #199: measure a stage on another provider without touching the repo-wide AI_PROVIDER that
      # production reads. The eval step only; schedule ignores it. A run whose model is not the suite's
      # published model is never appended to its history (ADR-0032 amendment): artifact + step summary only.
      provider:
        description: Provider for this run only (repo-variable = vars.AI_PROVIDER). Use publish off for a non-baseline provider
        type: choice
        required: true
        default: repo-variable
        options:
          - repo-variable
          - groq
          - anthropic
      publish:
        description: Add the run to the eval dashboard on GitHub Pages (default branch only)
        type: boolean
        default: true
      init_site:
        description: First deploy only — start an empty history if the site has no scorecard yet
        type: boolean
        default: false
      restore_run_id:
        description: Restore the dashboard history from the eval-site backup of this run ID instead of the live site
        required: false
        default: ''

permissions:
  contents: read

# One run per branch at a time: each publish reads the deployed site, then redeploys it. The weekly
# run (ref = default branch) queues behind a manual run on the default branch and vice versa; GitHub
# keeps one pending run per group, so a third run cancels the pending one, never the running one.
# pr-evals.yml keys its own group per PR, so the two never block each other. They share the Groq TPM,
# each waiting out the other's 429s (ADR-0028), only slower while they overlap.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    # cases x repeats calls share the 8K TPM with every other pipeline run: slow, never failing.
    # One call may wait 20 retries x 60 s; the rest of the run fits the remaining time (ADR-0028).
    # Per suite: review x 3 ≈ 35-40 min, ≈ 70 min worst case.
    timeout-minutes: 120
    strategy:
      # One suite at a time (they share the TPM); a threshold miss or a timeout in one suite never
      # cancels the next, and publish still gets the others. A scheduled run has one suite.
      max-parallel: 1
      fail-fast: false
      matrix:
        # schedule: the cron's suite; the crons cover the registry once (scripts/lib/eval_suites.mjs,
        # checked by workflow_gates.test.mjs). An unmapped cron yields an empty suite: run_evals.mjs fails.
        suite: ${{ fromJSON(format('["{0}"]', github.event_name == 'schedule' && fromJSON('{"23 6 * * 1":"validation","23 6 * * 3":"review"}')[github.event.schedule] || inputs.suite)) }}
    steps:
      # The eval step handles LLM output and API keys: no push credential on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run eval suite
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          # The dashboard keys run details by run_id: one per suite, or the suites overwrite each other.
          EVAL_RUN_ID: ${{ github.run_id }}-${{ matrix.suite }}
          SUITE: ${{ matrix.suite }}
          REPEATS: ${{ inputs.repeats || '3' }}
          # ADR-0028: a Groq rate limit (429, or 413 rate_limit_exceeded) is waited out, never fatal.
          # Hint-less limits wait one 60 s TPM window; retries × wait ≤ timeout-minutes − 3 min.
          LLM_MAX_RETRY_WAIT_MS: '60000'
          GROQ_MAX_RETRIES: '20'
          # Optional pre-flight cap (docs/evals.md#token-budget): unset repository variable = no cap.
          # Not on schedule: the static estimate ignores Groq's prompt cache (one suite × 3 ≈ 285k
          # estimated, ≤ 200k counted), so any cap under the TPD would refuse every weekly run. The
          # circuit breaker still stops a weekly run at the first TPD 429.
          EVAL_TOKEN_BUDGET: ${{ github.event_name != 'schedule' && vars.EVAL_TOKEN_BUDGET || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT }}
          AI_PROVIDER: ${{ github.event_name != 'schedule' && inputs.provider != 'repo-variable' && inputs.provider || vars.AI_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_URL: ${{ vars.GROQ_API_URL }}
          GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT }}
        run: node scripts/run_evals.mjs --suite "$SUITE" --repeats "$REPEATS"

      # Model, scores, cost (chars/4 estimate) and review coverage next to the suite's published run, in the
      # step summary. No API key: it reads the results file and the public site. Never decides the job.
      - name: Report run vs published baseline
        if: always()
        continue-on-error: true
        env:
          EVAL_SITE_URL: ${{ vars.EVAL_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          shopt -s nullglob
          files=(evals/results/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "No results file to report"; exit 0; fi
          node scripts/build_eval_site.mjs --report --site-url "$EVAL_SITE_URL" "${files[@]}"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}-${{ matrix.suite }}
          path: |
            evals/results/
            evals/history.jsonl
          if-no-files-found: ignore
          overwrite: true

      - name: Upload run trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-trace-${{ github.run_id }}-${{ matrix.suite }}
          path: ./observability/traces/${{ github.run_id }}.json
          if-no-files-found: ignore
          overwrite: true

  # Separate job: the Pages deploy credential never shares a runner with the eval step's
  # API keys or LLM output. Runs even when a threshold failed (the run is shown with a ❌
  # gate); runs that failed on error_rate (provider outage) are left out. The deployed site
  # is the history store: build_eval_site.mjs reads scorecard.json and runs/<id>.json back
  # from it and aborts on any error other than a first-deploy 404, so a transient failure
  # never deploys a site without history.
  publish:
    needs: eval
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.publish) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    # Pages hosts one site, also deployed by pipeline-site.yml: both deploy jobs read the live site and
    # redeploy it, so they share one group (ADR-0027 amendment, 2026-10-17). Never cancelled; the
    # workflow-level groups (evals-<ref>, pipeline-site) keep at most one job of each side in it, so
    # GitHub's one-pending-per-group rule never cancels a pending eval publish.
    concurrency:
      group: pages-site-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Unattended runs never start an empty history nor restore a backup: both stay manual choices.
    env:
      INIT_SITE: ${{ github.event_name != 'schedule' && inputs.init_site }}
      RESTORE_RUN_ID: ${{ github.event_name != 'schedule' && inputs.restore_run_id || '' }}
      # A run on the repo's configured provider whose model is not the suite's published one is drift
      # (GROQ_MODEL bump, model retirement): fail rather than freeze the history behind a notice (#209).
      # A dispatch with an explicit provider is a measurement: notice only.
      MODEL_CHANGE_FAILS: ${{ github.event_name == 'schedule' || inputs.provider == 'repo-variable' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The pipeline views are rebuilt from the metrics branch (run records, trace indexes), never read
      # back from the site: every deploy carries both halves. A failed checkout fails the deploy.
      - name: Check out the metrics branch
        uses: actions/checkout@v4
        with:
          ref: metrics
          path: .metrics
          persist-credentials: false
          sparse-checkout: metrics

      # One artifact per suite; results files (<suite>-<runId>-<suite>.json) never collide. Each artifact's
      # history.jsonl does (last one wins); the build only reads *.json.
      - name: Download eval results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: eval-results-${{ github.run_id }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/eval-results

      - name: Download history backup to restore
        if: env.RESTORE_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: eval-site-${{ env.RESTORE_RUN_ID }}
          run-id: ${{ env.RESTORE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/eval-site-restore

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # History comes from the live site, or from a backup when restore_run_id is set. An empty
      # start (404 on scorecard.json) is accepted only with init_site; otherwise the build aborts.
      - name: Build eval dashboard
        id: build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          RESTORE_DIR: ${{ runner.temp }}/eval-site-restore
          RESULTS_DIR: ${{ runner.temp }}/eval-results
          SITE_DIR: ${{ runner.temp }}/eval-site
          PIPELINE_DIR: ${{ github.workspace }}/.metrics
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          results=("$RESULTS_DIR"/**/*.json)
          if [ ${#results[@]} -eq 0 ] && [ -z "$RESTORE_RUN_ID" ]; then
            echo "No eval results to publish"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--out "$SITE_DIR" --pipeline-dir "$PIPELINE_DIR")
          if [ -n "$RESTORE_RUN_ID" ]; then
            args+=(--previous-dir "$RESTORE_DIR")
          else
            args+=(--site-url "$SITE_URL")
            if [ "$INIT_SITE" = "true" ]; then args+=(--allow-empty); fi
          fi
          if [ "$MODEL_CHANGE_FAILS" = "true" ]; then args+=(--fail-on-model-change); fi
          node scripts/build_eval_site.mjs "${args[@]}" "${results[@]}"
          echo "built=true" >> "$GITHUB_OUTPUT"

      # The deployed site is the only live copy of the history: keep every deployed tree for
      # 90 days so any previous state can be restored (workflow input restore_run_id).
      - name: Back up the dashboard
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-site-${{ github.run_id }}
          path: ${{ runner.temp }}/eval-site
          include-hidden-files: true
          retention-days: 90

      - name: Upload Pages artifact
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/eval-site

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.built == 'true'
        id: deploy
        uses: actions/deploy-pages@v4

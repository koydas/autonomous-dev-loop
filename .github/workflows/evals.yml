name: Evals

# Manual only: each run spends real LLM tokens (Groq free tier: 8K TPM).
# With `publish`, a run on the default branch is recorded on the scorecard: the
# `publish` job commits the generated files (evals/scorecard.json, evals/SCORECARD.md,
# README.md block) to the `evals/scorecard` branch and opens or updates a PR against
# the default branch, which only accepts changes through a PR (ADR-0027 amendment).
# Runs on other refs stay artifact-only.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Eval suite (see scripts/lib/eval_suites.mjs)
        required: true
        default: validation
      repeats:
        description: Runs per case (>1 measures consistency)
        required: true
        default: '1'
      publish:
        description: Record the run on the scorecard (default branch only)
        type: boolean
        default: true

permissions:
  contents: read

# One run per branch at a time: publishing rewrites the evals/scorecard branch.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      # The eval step handles LLM output and API keys: no push credential on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run eval suite
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUITE: ${{ inputs.suite }}
          REPEATS: ${{ inputs.repeats }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_URL: ${{ vars.GROQ_API_URL }}
          GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT }}
        run: node scripts/run_evals.mjs --suite "$SUITE" --repeats "$REPEATS"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: |
            evals/results/
            evals/history.jsonl
          if-no-files-found: ignore

      - name: Upload run trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-trace-${{ github.run_id }}
          path: ./observability/traces/${{ github.run_id }}.json
          if-no-files-found: ignore
          overwrite: true

  # Separate job: write access and the push credential never share a runner with the
  # eval step's API keys or LLM output. Runs even when a threshold failed (the run is
  # recorded with a ❌ gate); update_scorecard.mjs skips runs that failed on error_rate
  # (provider outage). Only deterministic generated files are committed.
  #
  # The default branch only accepts PRs, so the bot owns `evals/scorecard`: each run
  # rebuilds it from the default branch head, carries over evals/scorecard.json from the
  # pending PR (runs not merged yet), records the new run and force-pushes that branch
  # only. One PR stays open and accumulates runs until it is merged.
  publish:
    needs: eval
    if: ${{ !cancelled() && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download eval results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: eval-results-${{ github.run_id }}
          path: ${{ runner.temp }}/eval-results

      - name: Publish scorecard PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          PUBLISH_BRANCH: evals/scorecard
          SUITE: ${{ inputs.suite }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS_DIR: ${{ runner.temp }}/eval-results
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          results=("$RESULTS_DIR"/**/*.json)
          if [ ${#results[@]} -eq 0 ]; then echo "No eval results to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE"
          git checkout -B "$PUBLISH_BRANCH" "origin/$BASE"
          if git ls-remote --exit-code --heads origin "$PUBLISH_BRANCH" >/dev/null; then
            git fetch origin "$PUBLISH_BRANCH"
            git checkout "origin/$PUBLISH_BRANCH" -- evals/scorecard.json
          fi
          node scripts/update_scorecard.mjs "${results[@]}"
          git add evals/scorecard.json evals/SCORECARD.md README.md
          if git diff --cached --quiet; then echo "Scorecard unchanged"; exit 0; fi
          git commit -m "chore(evals): record ${SUITE} run ${RUN_ID} on the scorecard"
          git push --force origin "HEAD:refs/heads/${PUBLISH_BRANCH}"
          body="Records Evals run [${RUN_ID}](${RUN_URL}) (\`${SUITE}\`) on the scorecard: \`evals/scorecard.json\`, \`evals/SCORECARD.md\` and the README results block. Generated by the Evals workflow. Merge to publish; later runs update this PR until then."
          pr=$(gh pr list --head "$PUBLISH_BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // ""')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body "$body"
            echo "Updated scorecard PR #${pr}"
          else
            gh pr create --base "$BASE" --head "$PUBLISH_BRANCH" --title "chore(evals): scorecard update" --body "$body"
          fi

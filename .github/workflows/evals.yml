name: Evals

# Manual only: each run spends real LLM tokens (Groq free tier: 8K TPM).
# With `publish`, a run on the default branch is recorded on the scorecard: the
# `publish` job commits the generated files (evals/scorecard.json, evals/SCORECARD.md,
# README.md block) to the default branch (ADR-0027 amendment). Runs on other refs
# stay artifact-only.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Eval suite (see scripts/lib/eval_suites.mjs)
        required: true
        default: validation
      repeats:
        description: Runs per case (>1 measures consistency)
        required: true
        default: '1'
      publish:
        description: Record the run on the scorecard (default branch only)
        type: boolean
        default: true

permissions:
  contents: read

# One run per branch at a time: publishing commits to the default branch.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      # The eval step handles LLM output and API keys: no push credential on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run eval suite
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUITE: ${{ inputs.suite }}
          REPEATS: ${{ inputs.repeats }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_URL: ${{ vars.GROQ_API_URL }}
          GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT }}
        run: node scripts/run_evals.mjs --suite "$SUITE" --repeats "$REPEATS"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: |
            evals/results/
            evals/history.jsonl
          if-no-files-found: ignore

      - name: Upload run trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-trace-${{ github.run_id }}
          path: ./observability/traces/${{ github.run_id }}.json
          if-no-files-found: ignore
          overwrite: true

  # Separate job: write access and the push credential never share a runner with the
  # eval step's API keys or LLM output. Runs even when a threshold failed (the run is
  # recorded with a ❌ gate); update_scorecard.mjs skips runs that failed on error_rate
  # (provider outage). Only deterministic generated files are committed, rebuilt on the
  # latest default-branch head before each push so a concurrent commit is never lost.
  publish:
    needs: eval
    if: ${{ !cancelled() && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download eval results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: eval-results-${{ github.run_id }}
          path: ${{ runner.temp }}/eval-results

      - name: Publish scorecard
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          SUITE: ${{ inputs.suite }}
          RUN_ID: ${{ github.run_id }}
          RESULTS_DIR: ${{ runner.temp }}/eval-results
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          results=("$RESULTS_DIR"/**/*.json)
          if [ ${#results[@]} -eq 0 ]; then echo "No eval results to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            node scripts/update_scorecard.mjs "${results[@]}"
            git add evals/scorecard.json evals/SCORECARD.md README.md
            if git diff --cached --quiet; then echo "Scorecard unchanged"; exit 0; fi
            git commit -m "chore(evals): record ${SUITE} run ${RUN_ID} on the scorecard"
            if git push origin "HEAD:${BRANCH}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the scorecard to ${BRANCH} (branch protection or concurrent pushes)"
          exit 1

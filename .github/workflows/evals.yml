name: Evals

# Manual only: each run spends real LLM tokens (Groq free tier: 8K TPM).
# With `publish`, a run on the default branch is added to the eval dashboard on
# GitHub Pages (ADR-0027 amendment): the `publish` job reads the history back from the
# deployed site, adds the run and redeploys. Nothing is committed. Runs on other refs
# stay artifact-only.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Eval suite (see scripts/lib/eval_suites.mjs)
        required: true
        default: validation
      repeats:
        description: Runs per case (>1 measures consistency)
        required: true
        default: '1'
      publish:
        description: Add the run to the eval dashboard on GitHub Pages (default branch only)
        type: boolean
        default: true
      init_site:
        description: First deploy only — start an empty history if the site has no scorecard yet
        type: boolean
        default: false
      restore_run_id:
        description: Restore the dashboard history from the eval-site backup of this run ID instead of the live site
        required: false
        default: ''

permissions:
  contents: read

# One run per branch at a time: each publish reads the deployed site, then redeploys it.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      # The eval step handles LLM output and API keys: no push credential on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run eval suite
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUITE: ${{ inputs.suite }}
          REPEATS: ${{ inputs.repeats }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_API_URL: ${{ vars.GROQ_API_URL }}
          GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT }}
        run: node scripts/run_evals.mjs --suite "$SUITE" --repeats "$REPEATS"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: |
            evals/results/
            evals/history.jsonl
          if-no-files-found: ignore

      - name: Upload run trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-trace-${{ github.run_id }}
          path: ./observability/traces/${{ github.run_id }}.json
          if-no-files-found: ignore
          overwrite: true

  # Separate job: the Pages deploy credential never shares a runner with the eval step's
  # API keys or LLM output. Runs even when a threshold failed (the run is shown with a ❌
  # gate); runs that failed on error_rate (provider outage) are left out. The deployed site
  # is the history store: build_eval_site.mjs reads scorecard.json and runs/<id>.json back
  # from it and aborts on any error other than a first-deploy 404, so a transient failure
  # never deploys a site without history.
  publish:
    needs: eval
    if: ${{ !cancelled() && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download eval results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: eval-results-${{ github.run_id }}
          path: ${{ runner.temp }}/eval-results

      - name: Download history backup to restore
        if: inputs.restore_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: eval-site-${{ inputs.restore_run_id }}
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/eval-site-restore

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # History comes from the live site, or from a backup when restore_run_id is set. An empty
      # start (404 on scorecard.json) is accepted only with init_site; otherwise the build aborts.
      - name: Build eval dashboard
        id: build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          INIT_SITE: ${{ inputs.init_site }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
          RESTORE_DIR: ${{ runner.temp }}/eval-site-restore
          RESULTS_DIR: ${{ runner.temp }}/eval-results
          SITE_DIR: ${{ runner.temp }}/eval-site
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          results=("$RESULTS_DIR"/**/*.json)
          if [ ${#results[@]} -eq 0 ] && [ -z "$RESTORE_RUN_ID" ]; then
            echo "No eval results to publish"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--out "$SITE_DIR")
          if [ -n "$RESTORE_RUN_ID" ]; then
            args+=(--previous-dir "$RESTORE_DIR")
          else
            args+=(--site-url "$SITE_URL")
            if [ "$INIT_SITE" = "true" ]; then args+=(--allow-empty); fi
          fi
          node scripts/build_eval_site.mjs "${args[@]}" "${results[@]}"
          echo "built=true" >> "$GITHUB_OUTPUT"

      # The deployed site is the only live copy of the history: keep every deployed tree for
      # 90 days so any previous state can be restored (workflow input restore_run_id).
      - name: Back up the dashboard
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-site-${{ github.run_id }}
          path: ${{ runner.temp }}/eval-site
          include-hidden-files: true
          retention-days: 90

      - name: Upload Pages artifact
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/eval-site

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.built == 'true'
        id: deploy
        uses: actions/deploy-pages@v4

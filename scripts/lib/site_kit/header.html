<div class="sk-bar" data-site-kit="{{version}}" data-sk-current="{{site_id}}">
  <div class="sk-bar-in">
    <a class="sk-brand" href="{{site_url}}"><span class="sk-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></span><span class="sk-brand-name">{{site_name}}</span></a>
    <nav class="sk-nav" aria-label="Sites">
      <details class="sk-menu">
        <summary><span class="sk-sum-sites">Sites</span><span class="sk-sum-menu">Menu</span><svg class="sk-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
        <div class="sk-panel">
          <ul class="sk-sites">
{{#sites}}            <li><a href="{{s.url}}"{{s.cur}}><span class="sk-site-name">{{s.label}}</span><span class="sk-site-blurb">{{s.blurb}}</span></a></li>
{{/sites}}          </ul>
          <div class="sk-panel-extra"><a href="{{repo_url}}">GitHub · {{repo_name}}</a><a class="sk-to-portfolio" href="{{portfolio_url}}">← Back to the portfolio</a></div>
        </div>
      </details>
      <div class="sk-actions"><a class="sk-link sk-to-portfolio" href="{{portfolio_url}}">← Portfolio</a><a class="sk-link" href="{{repo_url}}">GitHub</a></div>
    </nav>
  </div>
</div>
